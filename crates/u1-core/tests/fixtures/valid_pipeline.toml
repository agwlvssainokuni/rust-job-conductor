format_version = 1

[pipeline]
name = "nightly"
description = "夜間バッチ(抽出、変換、読み込み、通知)"

[[job]]
id = "extract"
command = "extract --all --since yesterday"

[[job]]
id = "transform"
command = "transform \"in dir\" $HOME"
warning_exit_codes = [3, 4]
success_exit_codes = [0, 2]

[[job.transitions]]
on = "warning"
next = "notify"

[[job]]
id = "load"
command = "load"

[[job.transitions]]
on = "success"
next = "@end"

[[job]]
id = "notify"
command = "notify --channel ops"
