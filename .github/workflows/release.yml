name: Release

# タグ v* を付けると動く。下書き(draft)のリリースを作る。人が確認して公開する。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    name: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag must be on main and match the crate version
        id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
          crate=$(grep -m1 '^version' crates/u3-cli/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          [ "$version" = "$crate" ] || { echo "tag $version != crate version $crate"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  # リリースの前に、マージの関門と同じ検査をすべて通す
  checks:
    name: checks
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: [verify-tag, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, ext: tar.gz, bin: conductor }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz, bin: conductor }
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz, bin: conductor }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, ext: zip, bin: conductor.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # 配布するのは conductor だけ。テスト専用の補助の実行ファイルは含めない
      - run: cargo build --release --locked --bin conductor --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="conductor-${{ needs.verify-tag.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" LICENSE "$name/"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      # まとめたファイルを展開して、動くことを確かめる(実行できる対象のみ)
      - name: smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          mkdir smoke
          if [ "${{ matrix.ext }}" = "zip" ]; then 7z x "$ASSET" -osmoke > /dev/null; else tar xzf "$ASSET" -C smoke; fi
          bin=$(ls smoke/*/${{ matrix.bin }})
          "$bin" --version
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            file "$bin" | grep -E 'statically linked|static-pie linked'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  draft-release:
    name: draft-release
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          flags="--draft --generate-notes"
          [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" $flags \
            --notes "Intel macOS (x86_64-apple-darwin): 動作の確認なし(クロスビルド)。SHA256SUMS で、ダウンロードしたファイルを確かめてください。"
