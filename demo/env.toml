format_version = 1

[pipeline]
name = "env-demo"
description = "環境変数のデモ"
# `.env` ファイルから読む(相対パスは、この定義ファイルのあるディレクトリが基準)。
# `local.env` は無くてもよい(`required = false`。置いていないので、黙って読み飛ばす)。
env_file = ["demo.env", { path = "local.env", required = false }]

# 全ジョブに足す環境変数。`.env` より強い。
[pipeline.env]
DEMO_GREETING = "hello from [pipeline.env]"
DEMO_STAGE = "pipeline"

# show-env: 渡された環境変数を表示する。[job.env] が最も強い(CONDUCTOR_* は conductor が自動で渡す)。
[[job]]
id = "show-env"
command = "sh scripts/show-env.sh"

[job.env]
DEMO_STAGE = "job"
