format_version = 1

[pipeline]
name = "env-demo"
description = "環境変数のデモ(Windows 版)"
# `.env` ファイルから読む(相対パスは、この定義ファイルのあるディレクトリが基準)。
# `local.env` は無くてもよい(`required = false`。置いていないので、黙って読み飛ばす)。
env_file = ["demo.env", { path = "local.env", required = false }]

# 全ジョブに足す環境変数。`.env` より強い。
[pipeline.env]
DEMO_GREETING = "hello from [pipeline.env]"
DEMO_STAGE = "pipeline"

# show-env: 渡された環境変数を表示する。[job.env] が最も強い(CONDUCTOR_* は conductor が自動で渡す)。
# `command` の文字列では、バックスラッシュは、そのままの文字として扱われる。
[[job]]
id = "show-env"
command = 'scripts\show-env.cmd'
# 親(conductor を起動した側)から引き継いだ環境変数を、このジョブには渡さない(v0.10.0 以降)。
# Windows では、名前の大文字小文字を区別せずに消す。
unset_env = ["DEMO_PROXY"]

[job.env]
DEMO_STAGE = "job"
