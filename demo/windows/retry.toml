format_version = 1

[pipeline]
name = "retry-demo"
description = "リトライのデモ(Windows 版)"

# 全ジョブの既定のリトライ(`[pipeline.retry]`、v0.10.0 以降)。`retry` を書かないジョブに当てはまる。
# 終了コード 75 は「一時的な失敗」。1 秒待って、最大 3 回、実行し直す。
# 待ち時間を伸ばすには、multiplier と max_interval を、一緒に書く(例: multiplier = 2、max_interval = "1m")。
[pipeline.retry]
exit_codes = [75]
max = 3
interval = "1s"

# flaky: `retry` を書かないので、既定のリトライで実行し直す。
# ジョブごとに変えるときは `[job.retry]` を書く(既定と混ぜず、丸ごとその表を使う)。
# 既定を打ち消して、リトライさせないジョブには、`retry = false` を書く(例: 次の 4 行)。
#   [[job]]
#   id = "once"
#   command = 'scripts\once.cmd'
#   retry = false
# `command` の文字列では、バックスラッシュは、そのままの文字として扱われる。
[[job]]
id = "flaky"
command = 'scripts\flaky.cmd'
